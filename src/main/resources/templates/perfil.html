<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | ELO Seguro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header(${usuarioLogado})}"></div>
<main class="page-container narrow">
    <section class="panel">
        <h1>Meu perfil</h1>
        <div class="data-row"><strong>Nome</strong><span th:text="${usuarioLogado.nome}"></span></div>
        <div class="data-row"><strong>E-mail</strong><span th:text="${usuarioLogado.email}"></span></div>
        <div class="data-row"><strong>Perfil</strong><span th:text="${usuarioLogado.perfil}"></span></div>
        <div class="data-row"><strong>Status</strong><span th:text="${usuarioLogado.ativo ? 'Ativo' : 'Inativo'}"></span></div>
    </section>
</main>
</body>
</html>
