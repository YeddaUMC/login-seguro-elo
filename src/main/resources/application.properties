spring.application.name=login-seguro-elo
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/login_seguro_elo}
spring.data.mongodb.database=${MONGODB_DATABASE:login_seguro_elo}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
