<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><link rel="stylesheet" th:href="@{/css/ui.css}"><title>Chamados | Thindesk</title></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container page"><div class="page-heading"><div><div class="eyebrow">ATENDIMENTO</div><h1>Chamados</h1><p>Consulte e atualize os chamados técnicos.</p></div><button type="button" id="new-ticket" class="primary-btn">+ Novo chamado</button></div><section class="panel"><div class="section-line"><h2>Lista de chamados</h2><input id="search-tickets" class="search-field" placeholder="Pesquisar descrição"></div><div id="feedback" class="alert" role="status" hidden></div><div class="table-scroll"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Técnico</th><th>Status</th><th>Usuário</th><th></th></tr></thead><tbody id="all-tickets"><tr><td colspan="6">Carregando...</td></tr></tbody></table></div></section></main><dialog id="ticket-dialog" class="ticket-dialog" aria-labelledby="dialog-title"><form id="ticket-form"><div class="dialog-heading"><div><span class="eyebrow">CHAMADO TÉCNICO</span><h2 id="dialog-title">Novo chamado</h2></div><button type="button" class="close-dialog" aria-label="Fechar">×</button></div><input type="hidden" name="id"><label>Descrição<textarea name="descricao" rows="2" maxlength="500" required></textarea></label><div class="dialog-grid"><label>Tipo<input name="tipo" maxlength="80" required placeholder="Ex.: Rede"></label><label>Técnico<input name="tecnico" maxlength="120" placeholder="Nome do responsável"></label><label>Usuário<input name="usuario" maxlength="120" placeholder="Solicitante"></label><label>Situação<select name="status"><option value="ABERTO">Aberto</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDO">Concluído</option><option value="CANCELADO">Cancelado</option></select></label><label>Prioridade<select name="prioridade"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="ALTA">Alta</option><option value="URGENTE">Urgente</option></select></label></div><label>Considerações técnicas<textarea name="consideracoesTecnicas" rows="3" maxlength="3000" placeholder="Descreva as providências tomadas..."></textarea></label><div id="form-error" class="alert error" role="alert" hidden></div><div class="dialog-actions"><button type="button" class="ghost-btn close-dialog">Cancelar</button><button class="primary-btn" type="submit" id="submit-ticket">Salvar chamado</button></div></form></dialog><script th:src="@{/js/common.js}" defer></script><script th:src="@{/js/tickets.js}" defer></script></body></html>
