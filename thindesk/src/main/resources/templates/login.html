<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><link rel="stylesheet" th:href="@{/css/ui.css}"><title>Entrar | Thindesk</title></head><body class="login-body"><main class="login-card"><div class="login-brand"><span class="brand-mark brand-mark-large">T</span></div><h1>Bem-vindo ao Thindesk</h1><p>Entre para acompanhar os chamados técnicos.</p><div class="alert error" th:if="${param.error}">Usuário ou senha incorretos.</div><div class="alert success" th:if="${param.logout}">Sessão encerrada com sucesso.</div><form th:action="@{/login}" method="post" class="form-stack"><label>Usuário<input name="username" type="text" autocomplete="username" required placeholder="Seu usuário"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="primary-btn" type="submit">Entrar</button></form><small>Acesso restrito à administração.</small></main></body></html>
