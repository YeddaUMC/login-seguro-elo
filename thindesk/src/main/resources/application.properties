spring.application.name=thindesk
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true
spring.security.user.name=${THINDESK_ADMIN_USER:admin}
spring.security.user.password=${THINDESK_ADMIN_PASSWORD}
spring.security.user.roles=ADMIN
server.servlet.session.timeout=30m
spring.thymeleaf.cache=false
thindesk.demo.seed=${THINDESK_DEMO_SEED:false}
